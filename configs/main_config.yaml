# try to only keep fixed values in here that do not change due to sweeps
per_device_train_batch_size: 1 #TODO: how to handle these
gradient_accumulation_steps: 16

learning_rate: 2e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
num_train_epochs: 1
save_steps: 500
logging_steps: 10
fp16: true
bf16: false
overwrite_output_dir: true
logging_first_step: true
save_total_limit: 2
seed: 42
gradient_checkpointing: true