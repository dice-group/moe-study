stage: sft
model_name_or_path: meta-llama/Llama-3.1-8B
dataset: sampled_scienceqa
dataset_dir: ./sampled_data
cutoff_len: 256
max_samples: null
finetuning_type: mola
ddp_backend: nccl

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 3e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
num_train_epochs: 1

save_steps: 500
logging_steps: 10
fp16: true
bf16: false
report_to: none

do_train: true
resize_vocab: true

output_dir: ./outputs/mola-7b
overwrite_output_dir: true
