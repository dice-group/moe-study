program: src/train_hf.py
command:
  - ${env}
  - python
  - ${program}
  - --do_harness_eval
  - ${args}
method: grid
metric:
  name: eval_loss
  goal: minimize

parameters:
  ## variable params, these will be changed by wandb ##
  model_name_or_path:
    values:
      - "meta-llama/Llama-3.2-1B"
      - "meta-llama/Llama-3.2-3B"
      - "meta-llama/Llama-3.1-8B"
  tokenized_dataset_dir:
    values:
      - "/data/MERLIN/tokenized_test_data" # paths to data with 5/10/50/200 langs
      - "/data/MERLIN/tokenized_test_data"
      - "/data/MERLIN/tokenized_test_data"

  ## fixed params to be used in every run ##
  config:
    value: "configs/main_config.yaml"
  tokenizer:
    value: "/data/MERLIN/multilingual_tokenizer/250K_vocab_size/trained_multilingual_tokenizer_llama-3.2-1B"   #TODO: depending on model used, maybe just renaming fixes this
  use_method:
    value: "adamole"

  adamole_num_experts:
    value: 8
  adamole_max_threshold:
    value: 0.125
  adamole_aux_coef:
    value: 1e-3

  lora_r:
    value: 32
  lora_alpha:
    value: 16
  lora_dropout:
    value: 0.05
  lora_targets:
    value: "q_proj,k_proj,v_proj,o_proj"

  harness_tasks:
    value: "belebele hellaswag arc xnli"
  wandb_project:
    value: "moe-study"

  # unique output dir for each sweep run
  output_dir:
    value: "./outputs/${use_method}_${model_name_or_path}_${tokenized_dataset_dir}_${wandb.run.id}"

# note all the params are set according to the paper currently