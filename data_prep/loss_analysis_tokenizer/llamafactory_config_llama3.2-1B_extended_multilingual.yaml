model_args:
  model_name_or_path: meta-llama/Llama-3.2-1B
  tokenizer_name_or_path: /scratch/hpc-prf-merlin/project_data/moe_study/trained_multilingual_tokenizers/256k_vocab/llama-3.2-1B
  use_flash_attn: true
  torch_dtype: bfloat16

data_args:
  stage: sft
  dataset_format: json
  dataset_list:
    - path: ./loss_analysis_dataset/combined.jsonl
      split: train
      field: text
  text_field: text
  lang_field: lang
  cutoff_len: 4096
  max_samples: null
  shuffle_before_pack: true
  packing: true
  streaming: false
  preprocessing_num_workers: 8

training_args:
  output_dir: ./loss_analysis_output/extended
  overwrite_output_dir: true
  do_train: true
  do_eval: false
  do_predict: false
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 10000
  learning_rate: 1.0e-5
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 25
  evaluation_strategy: no
  save_steps: 2000
  save_total_limit: 5
  dataloader_num_workers: 8
  gradient_checkpointing: true
  bf16: true
  tf32: false
  run_name: llama32-1b-extended-tokenizer
  report_to:
    - wandb

finetuning_args:
  finetuning_type: full

wandb_args:
  enable: true
  project: multilingual_tokenizer_eval
